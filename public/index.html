<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087e60"><meta name="description" content="Wérify — examine claims, review evidence, prepare responsible publications."><title>Wérify</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="top"><a href="/" class="brand" aria-label="Wérify">Wérify<span class="brand-dot">.</span></a><nav aria-label="Language"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></nav></header>
<main>
 <section class="intro"><span class="eyebrow" data-t="eyebrow"></span><h1 data-t="headline"></h1><p data-t="subhead"></p></section>
 <div class="workspace">
 <section class="panel input-panel" aria-labelledby="input-title"><div class="section-top"><h2 id="input-title" data-t="inputTitle"></h2><span class="step">01</span></div>
 <form id="claim-form"><div class="tabs" role="group" aria-label="Input"><button type="button" id="text-tab" class="active" data-t="text" aria-pressed="true"></button><button type="button" id="image-tab" data-t="screenshot" aria-pressed="false"></button></div>
 <div id="upload-area" hidden><label class="upload" for="image-file"><span class="upload-symbol" aria-hidden="true">↑</span><strong data-t="choose"></strong><span data-t="formats"></span></label><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" hidden><div id="preview-wrap" hidden><img id="image-preview" alt=""><button id="remove-image" type="button" class="text-button" data-t="remove"></button></div><p class="hint" data-t="manualText"></p></div>
 <label for="claim" id="claim-label" data-t="claimLabel"></label><textarea id="claim" maxlength="1000" rows="6" required></textarea><div class="field-bottom"><span data-t="contextHint"></span><span id="counter">0 / 1 000</span></div>
 <button class="primary full" id="verify" type="submit" data-t="verify"></button><div id="message" role="status" aria-live="polite" hidden></div></form>
 <div class="divider"></div><p class="demo-label" data-t="demoHint"></p><button id="demo" class="secondary full" data-t="tryDemo" type="button"></button><p class="privacy" data-t="privacy"></p></section>
 <section id="report-panel" class="panel report-panel" aria-labelledby="report-title"><div class="section-top"><h2 id="report-title" data-t="reportTitle"></h2><span class="step">02</span></div>
 <div id="empty-report" class="empty"><div class="report-symbol" aria-hidden="true">✓</div><h3 data-t="emptyTitle"></h3><p data-t="emptyDescription"></p><div class="outline-line"></div><div class="outline-line short"></div></div>
 <div id="report" hidden><div class="notice"><strong data-t="demoBadge"></strong><p data-t="demoNotice"></p></div><div class="verdict"><span aria-hidden="true">!</span><div><h3 data-t="insufficient"></h3><p data-t="insufficientDetail"></p></div></div><span class="label" data-t="analyzed"></span><h3 class="sample-claim" data-t="sampleClaim"></h3><span class="label" data-t="conclusion"></span><p data-t="sampleConclusion"></p><h4 data-t="sources"></h4><button id="source-toggle" class="source-card" type="button" aria-expanded="false" aria-controls="source-details"><span class="document-icon" aria-hidden="true">≡</span><span><strong data-t="sampleSource"></strong><small data-t="sampleSourceDescription"></small></span><span aria-hidden="true">↗</span></button><div id="source-details" class="source-detail" hidden><h4 data-t="sourceDetails"></h4><p data-t="sourceDisclosure"></p><blockquote data-t="sampleClaim"></blockquote></div><button id="prepare-draft" class="primary full" data-t="prepareDraft" type="button"></button></div></section>
 </div>
 <section id="draft-panel" class="panel draft-panel" aria-labelledby="draft-title" hidden><div class="section-top"><h2 id="draft-title" data-t="draftTitle"></h2><span class="step">03</span></div><div class="notice"><strong data-t="review"></strong><p data-t="reviewDetail"></p></div><label for="draft" class="sr-only" data-t="draftTitle"></label><textarea id="draft" rows="5"></textarea><div class="actions"><button type="button" class="secondary" id="copy" data-t="copy"></button><button type="button" class="primary" id="download" data-t="download"></button></div><p id="draft-message" role="status" aria-live="polite"></p></section>
 <section class="principles"><div><span>01</span><h3 data-t="principle1"></h3><p data-t="principle1Detail"></p></div><div><span>02</span><h3 data-t="principle2"></h3><p data-t="principle2Detail"></p></div><div><span>03</span><h3 data-t="principle3"></h3><p data-t="principle3Detail"></p></div></section>
</main><footer><a class="brand" href="/">Wérify.</a><p data-t="footer"></p></footer>
</body></html>
